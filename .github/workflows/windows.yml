name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixture dependency
        run: python -m pip install -r test/fixtures/requirements.txt
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Windows SSH and SFTP acceptance
        shell: pwsh
        run: flutter test integration_test/ssh_mate_e2e_test.dart -d windows "--dart-define=SSH_MATE_REPO=$env:GITHUB_WORKSPACE"
      - name: Build Windows release
        run: flutter build windows --release
